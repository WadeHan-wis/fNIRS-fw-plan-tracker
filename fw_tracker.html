<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>fNIRS 양산형 FW 개발 트래커 (Zephyr/S1·S2 기반) v1.4</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --border:#E3E6EA;
  --text:#1B2430; --dim:#6B7480;
  --accent:#2C6E63; --due:#A23E58;
  --g0:#6B5B95; --g1:#C97B3D; --g2:#4C8C6B; --g3:#3C7A9E; --g4:#AD8B12; --g5:#A23E58;
  --st-todo:#E2555A; --st-todo-bg:#FDEBEC;
  --st-mid:#D9A441; --st-mid-bg:#FBF1DD;
  --st-done:#3F9142; --st-done-bg:#E7F4E8;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--border); padding:14px 22px 0 22px;
}
.headtop{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;}
h1{font-size:18px; margin:0 0 2px 0;}
.subtitle{color:var(--dim); font-size:12.5px; margin:0 0 10px 0;}
.stats{display:flex; gap:10px; flex-wrap:wrap;}
.stat{
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:8px 14px; min-width:104px; text-align:center;
}
.stat .num{font-size:19px; font-weight:700;}
.stat .lbl{font-size:11px; color:var(--dim); margin-top:1px;}
nav{display:flex; gap:2px; margin-top:12px; overflow-x:auto;}
nav button{
  background:none; border:none; padding:10px 14px; font-size:13px; color:var(--dim);
  cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;
}
nav button.active{color:var(--text); border-bottom-color:var(--accent); font-weight:600;}
nav button:hover{color:var(--text);}
main{padding:20px 22px 60px 22px; max-width:1500px; margin:0 auto;}
section{display:none;}
section.active{display:block;}
h2{font-size:15px; margin:22px 0 8px 0; padding-bottom:6px; border-bottom:1px solid var(--border);}
h2:first-child{margin-top:0;}
p.hint{color:var(--dim); font-size:12.5px; margin:4px 0 12px 0;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:16px;}

table{border-collapse:collapse; width:100%; font-size:12.8px;}
th{background:var(--text); color:#fff; text-align:left; padding:7px 9px; font-weight:600;}
td{border-bottom:1px solid var(--border); padding:7px 9px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.note{color:var(--dim); font-size:11.3px; display:block; margin-top:2px;}
.center{text-align:center;}

.chip{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff;}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.pill.todo{background:var(--st-todo-bg); color:var(--st-todo);}
.pill.mid{background:var(--st-mid-bg); color:var(--st-mid);}
.pill.done{background:var(--st-done-bg); color:var(--st-done);}
.pill.excl{background:#EEE; color:#999;}
.prio{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:5px; border:1px solid currentColor;}
.prio.P0{color:#B33; }
.prio.P1{color:#B37E00;}
.prio.P2{color:#999;}

.pctrow{display:flex; align-items:center; gap:6px;}
input[type=number].pctinput{width:52px; padding:3px 4px; border:1px solid var(--border); border-radius:5px; font-size:12.5px; text-align:right;}
.qbtn{border:1px solid var(--border); background:#fff; border-radius:5px; padding:2px 6px; font-size:10.5px; cursor:pointer; color:var(--dim);}
.qbtn:hover{background:var(--bg);}
input[type=checkbox]{width:16px; height:16px; cursor:pointer;}

.grouphead td{background:#FAFAFB; font-weight:700; font-size:12px; padding-top:10px;}
.groupbar-wrap{display:inline-block; width:110px; height:6px; background:#EEE; border-radius:3px; overflow:hidden; vertical-align:middle; margin-left:8px;}
.groupbar-fill{height:100%;}

/* Gantt */
.ganttscroll{overflow-x:auto;}
table.gantt{table-layout:fixed; font-size:10.5px;}
table.gantt th, table.gantt td{border:none; padding:0; text-align:center;}
table.gantt th.rowlabel, table.gantt td.rowlabel{
  text-align:left; width:230px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:3px 6px; border-right:1.5px solid #ccc; font-size:11px;
}
table.gantt col.daycol{width:34px;}
table.gantt th.gh{padding:3px 0; color:var(--dim); font-weight:500; border-bottom:1px solid var(--border);}
table.gantt th.gh.mark-target{color:var(--due); font-weight:700; background:#F7EAEE;}
table.gantt td.daycell{height:28px; border-bottom:1px solid #F0F0F2;}
.barwrap{position:relative; height:20px; margin:4px 3px; border-radius:4px; background:#F0F0F2;}
.barfill{position:absolute; left:0; top:0; height:100%; border-radius:4px 0 0 4px;}
.barfill.full{border-radius:4px;}
.barpct{position:absolute; right:5px; top:50%; transform:translateY(-50%); font-size:9px; color:#fff; font-weight:700; text-shadow:0 1px 1px rgba(0,0,0,.25);}
.barpct.dark{color:#444; text-shadow:none;}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; font-size:12px;}
.legend span.sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle;}

.riskitem{display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-bottom:1px solid var(--border);}
.riskitem:last-child{border-bottom:none;}
.riskitem.resolved{opacity:.5;}
.riskitem.resolved .risktext{text-decoration:line-through;}

.at-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
.at-row:last-child{border-bottom:none;}
.at-id{font-weight:700; width:52px; flex:0 0 auto;}
.at-name{font-weight:600; width:150px; flex:0 0 auto;}
.at-cond{color:var(--dim); flex:1;}

.metabox td{border:1px solid var(--border); padding:6px 12px;}
.metabox td.k{background:#FAFAFB; font-weight:700; width:120px;}

.overview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:900px){.overview-grid{grid-template-columns:1fr;}}
.contra{border-left:4px solid #C62828; background:#FFF6F6; padding:8px 12px; border-radius:0 6px 6px 0; margin-bottom:8px; font-size:12.5px;}
.contra b{color:#C62828;}
.priority-banner{border-left:4px solid var(--due); background:#FDF2F4; padding:12px 16px; border-radius:0 8px 8px 0; margin-bottom:16px; font-size:13px; line-height:1.6;}
.priority-banner b{color:var(--due);}
.arch-pre{background:#12161C; color:#D8E0E8; border-radius:8px; padding:14px 18px; font-size:11.5px; line-height:1.55; overflow-x:auto; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.arch-note{font-size:12px; color:var(--dim); margin:6px 0 0 0;}
.scope-note{background:#F2F0FA; border:1px solid #DCD6F0; border-radius:8px; padding:10px 14px; font-size:12.3px; margin:8px 0 16px 0;}
.resetbar{margin-top:26px; text-align:right;}
.resetbtn{background:none; border:1px solid var(--border); color:var(--dim); border-radius:6px; padding:6px 12px; font-size:11.5px; cursor:pointer;}
.resetbtn:hover{border-color:#c66; color:#c66;}

/* Day plan expandable rows */
tr.dayrow{cursor:pointer;}
tr.dayrow:hover td{background:#FAFAFC;}
tr.dayrow td.expander{width:20px; text-align:center; color:var(--dim); font-size:10px;}
.daypct-pill{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:10.5px; font-weight:700;}
.daypct-pill.zero{background:#F0F0F2; color:#999;}
.daypct-pill.some{background:var(--st-mid-bg); color:var(--st-mid);}
.daypct-pill.full{background:var(--st-done-bg); color:var(--st-done);}
tr.detailrow{display:none;}
tr.detailrow.open{display:table-row;}
tr.detailrow td{background:#FAFAFB; padding:14px 20px 16px 20px; border-bottom:1px solid var(--border);}
.detailgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
@media (max-width:1100px){.detailgrid{grid-template-columns:1fr;}}
.detailcol h4{font-size:11.5px; margin:0 0 6px 0; color:var(--dim); text-transform:none; letter-spacing:.2px;}
.detailcol ul{margin:0; padding-left:16px; font-size:12px;}
.detailcol li{margin-bottom:5px;}
.detailcol.tips h4{color:#3C7A9E;}
.detailcol.verify h4{color:#4C8C6B;}
.detailcol.caution h4{color:#B33;}
.checklist-box{grid-column:1/-1; margin-top:6px; padding-top:10px; border-top:1px dashed var(--border);}
.checklist-box h4{font-size:11.5px; margin:0 0 6px 0; color:var(--dim);}
.checkline{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.3px;}
.checkline.done span{text-decoration:line-through; color:#999;}

/* Weekly milestone table */
table.milestone th{background:#1B2430;}
table.milestone td.wk{font-weight:700; color:var(--accent); white-space:nowrap;}
table.milestone .mprog-wrap{display:inline-block; width:70px; height:6px; background:#EEE; border-radius:3px; overflow:hidden; vertical-align:middle; margin-right:6px;}
table.milestone .mprog-fill{height:100%; background:var(--accent);}

/* Daily deliverable + actual/gap log */
.output-box{background:#FFF9EC; border:1px solid #F3E3B8; border-radius:6px; padding:8px 12px; font-size:12.3px; margin-top:10px;}
.output-box b{color:#946200;}
.actual-box{grid-column:1/-1; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
.actual-box h4{font-size:11.5px; margin:0 0 8px 0; color:var(--dim);}
.actual-grid{display:grid; grid-template-columns:2fr 90px 2fr; gap:10px; align-items:start;}
.actual-grid textarea, .gap-grid textarea{width:100%; border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit; resize:vertical; min-height:44px;}
.actual-grid label, .gap-grid label{font-size:10.5px; color:var(--dim); display:block; margin-bottom:3px;}
.actual-grid input[type=number]{width:100%; border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; text-align:center;}
.gap-box{grid-column:1/-1; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
.gap-box h4{font-size:11.5px; margin:0 0 8px 0; color:var(--st-todo);}
.gap-grid{display:grid; grid-template-columns:1fr 1fr 1fr 120px; gap:10px;}
footer{text-align:center; color:var(--dim); font-size:11px; padding:14px; }
</style>
</head>
<body>

<header>
  <div class="headtop">
    <div>
      <h1>fNIRS 양산형 FW 개발 트래커</h1>
      <div class="subtitle">양산형 아키텍처 결정 반영 (2026-09-14) · Zephyr(NCS) + S1구조/S2프로토콜 계승 · 담당 Wade · Rev0~3 재산정 지점 2026-10-12(월)</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statOverall">–%</div><div class="lbl">Rev0~3 진행률</div></div>

      <div class="stat"><div class="num" id="statDday">–</div><div class="lbl">재산정일까지 영업일</div></div>
      <div class="stat"><div class="num" id="statUpdated">–</div><div class="lbl">마지막 업데이트</div></div>
    </div>
  </div>
  <nav id="tabnav"></nav>
</header>

<main>
  <section id="tab-overview"></section>
  <section id="tab-arch"></section>
  <section id="tab-analysis"></section>
  <section id="tab-tasks"></section>
  <section id="tab-gantt"></section>
  <section id="tab-dayplan"></section>
  <section id="tab-at"></section>
  <section id="tab-risk"></section>
</main>

<footer>진행 상황을 입력하면 로컬에 자동 저장되며, 체크리스트·그룹 진행률·간트차트가 같은 데이터를 기준으로 함께 갱신됩니다.</footer>

];

 ['재부팅/에러 상태머신', '`g_ctrl_status` → CTRL 태스크 경유, `NVIC_SystemReset()` 직접호출 금지', '`module_err_t` 에러코드 패턴 통일(Rev22)', 'S1의 "CTRL 경유 상태머신" + S2의 "통일된 에러코드 타입" 결합. Thermal Safety도 동일 패턴(Normal→Warning→Duty감소→OFF)'],

function weekMilestoneProgress(range){
  const ts = TASKS.filter(t=>!t.excl && t.start>=range[0] && t.start<=range[1]);

}

/* ============================== BUSINESS-DAY CALENDAR ============================== */
// Schedule scope: Rev0~Rev3 only (16 working days), per the 2026-09-14 architecture
// decision document. Rev4~Rev7 have no committed dates yet — they are re-planned at
// the Day16 checkpoint using Rev0~3 actuals, per the document's own recommendation.
//
// Excluded dates (public holidays only — 10/8 is now a real working day, see below):
//  - 9/24, 9/25: 추석 연휴 (Chuseok)
//  - 10/5: 개천절 대체공휴일 (Gaecheonjeol substitute holiday)
//  - 10/9: 한글날 (Hangul Day) — confirmed with the team on 2026-09-15
//  - 10/8 was previously left unassigned (matching an apparent gap in the source document's
//    own Day-by-day table). Now that OTA/DFU has been added as a required Rev2 item, 10/8 is
//    used as a real working day to host it — this keeps the Rev0~3 checkpoint on the same
//    date (10/12) instead of pushing everything out by another day.
const HOLIDAYS = new Set(['2026-09-24', '2026-09-25', '2026-10-05', '2026-10-09']);
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isBizDay(d){ const w=d.getDay(); return w!==0 && w!==6 && !HOLIDAYS.has(dateKey(d)); }
function genBizDays(start,end){
  const out=[]; let d=new Date(start);
  while(d<=end){ if(isBizDay(d)) out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
const CAL_START = new Date(2026,8,14); // 2026-09-14, Day1 per the architecture document
const CAL_SEARCH_END = new Date(2026,9,25);
const BIZDAYS = genBizDays(CAL_START, CAL_SEARCH_END).slice(0,17); // Rev0~3 (+OTA) = 17 working days
const N_DAYS = BIZDAYS.length;
const TARGET_DATE = BIZDAYS[N_DAYS-1]; // Day16 (10/12) — Rev0~3 checkpoint / re-planning point, NOT a final ship date
const DUE_DATE = TARGET_DATE;
const TARGET_IDX = N_DAYS;
const DUE_IDX = N_DAYS;
const WD_KR=['일','월','화','수','목','금','토'];
function dLabel(i){const d=BIZDAYS[i-1]; return (d.getMonth()+1)+'/'+d.getDate();}
function wLabel(i){const d=BIZDAYS[i-1]; return WD_KR[d.getDay()];}

function businessDaysUntil(target){
  const today=new Date(); today.setHours(0,0,0,0);
  const t=new Date(target); t.setHours(0,0,0,0);
  if (today.getTime()===t.getTime()) return 0;
  const dir = today<t ? 1 : -1;
  let cur=new Date(today), count=0;
  while(cur.getTime()!==t.getTime()){
    cur.setDate(cur.getDate()+dir);
    if(isBizDay(cur)) count+=dir;
  }
  return count;
}

/* ============================== STORAGE SHIM ==============================
   Inside a Claude.ai artifact, window.storage already exists and persists
   per-conversation. Outside Claude (e.g. hosted on GitHub Pages / any static
   server), window.storage does not exist, so we fall back to the browser's
   own localStorage with the same async get/set shape. Either way the rest
   of the app just calls window.storage.get/set and doesn't need to know
   which backend is actually being used. */
if (typeof window.storage === 'undefined') {
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem('claude_artifact:' + key);
      return v !== null ? {key, value: v, shared:false} : null;
    },
    set: async (key, value) => {
      localStorage.setItem('claude_artifact:' + key, value);
      return {key, value, shared:false};
    },
    delete: async (key) => {
      localStorage.removeItem('claude_artifact:' + key);
      return {key, deleted:true, shared:false};
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('claude_artifact:' + (prefix||'')))
        .map(k => k.replace('claude_artifact:', ''));
      return {keys, shared:false};
    },
  };
}

async function loadState(){
  try{
    const res = await window.storage.get('fw_tracker_state', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      STATE.taskProgress = Object.assign({}, DEFAULT_STATE.taskProgress, saved.taskProgress||{});
      STATE.atChecked    = Object.assign({}, DEFAULT_STATE.atChecked, saved.atChecked||{});
      STATE.riskResolved = Object.assign({}, DEFAULT_STATE.riskResolved, saved.riskResolved||{});
      STATE.dayChecks = Object.assign({}, DEFAULT_STATE.dayChecks, saved.dayChecks||{});
      STATE.dayActual = Object.assign({}, DEFAULT_STATE.dayActual, saved.dayActual||{});
      STATE.dayGap = Object.assign({}, DEFAULT_STATE.dayGap, saved.dayGap||{});
      STATE.updatedAt = saved.updatedAt || null;
    }
  }catch(e){ /* no saved state yet — use defaults */ }
  renderAll();
}
async function saveState(){
  STATE.updatedAt = new Date().toISOString();
  try{
    await window.storage.set('fw_tracker_state', JSON.stringify(STATE), false);
  }catch(e){ console.error('storage save failed', e); }
  renderAll();
}

function statusOf(pct){ if(pct>=100) return 'done'; if(pct>0) return 'mid'; return 'todo'; }
function statusLabel(pct){ if(pct>=100) return '완료'; if(pct>0) return '진행중'; return '미착수'; }
function groupAvg(gid){
  const ts = TASKS.filter(t=>t.group===gid && !t.excl);
  if(!ts.length) return 0;
  return Math.round(ts.reduce((s,t)=>s+STATE.taskProgress[t.id],0)/ts.length);
}
function overallAvg(){
  const ts = TASKS.filter(t=>!t.excl);
  return Math.round(ts.reduce((s,t)=>s+STATE.taskProgress[t.id],0)/ts.length);
}

      <td class="center"><span class="mprog-wrap"><span class="mprog-fill" style="width:${p}%;"></span></span><span class="mono" style="font-size:11px;">${p}%</span></td>
    </tr>`;
  }).join('');

  const rows = DAYPLAN.map(d=>{
    const idx = d[0];
    const [_, week, date, title, detail, output, note] = d;
    const det = DAY_DETAILS[idx] || {tips:[], verify:[], caution:[], checks:[]};
    const pct = dayCheckPct(idx);
    let pill = '';
    if(pct){
      const cls = pct.done===0 ? 'zero' : (pct.done===pct.total ? 'full' : 'some');
      pill = `<span class="daypct-pill ${cls}">${pct.done}/${pct.total}</span>`;
    }
    const dim = idx>TARGET_IDX ? 'style="color:#999;"' : '';
    const isOpen = openDays.has(idx);
    const actual = STATE.dayActual[idx] || {result:'', pct:0, evidence:''};
    const gap = STATE.dayGap[idx] || {reason:'', cause:'', action:'', due:''};

    const mainRow = `<tr class="dayrow" data-day-toggle="${idx}" ${dim}>
      <td class="expander">${isOpen?'▾':'▸'}</td>
      <td class="center mono">D${idx}</td><td class="center"><b>${week}</b></td><td class="center">${date}</td>
      <td><b>${title}</b>${pill}</td><td>${detail}</td><td class="note" style="display:block;">${note}</td>
    </tr>`;

    const detailRow = `<tr class="detailrow ${isOpen?'open':''}" id="detail-${idx}">
      <td colspan="7">
        <div class="detailgrid">
          <div class="detailcol tips"><h4>개발 팁</h4><ul>${det.tips.map(t=>`<li>${t}</li>`).join('') || '<li class="note">—</li>'}</ul></div>
          <div class="detailcol verify"><h4>검증해야 할 사항</h4><ul>${det.verify.map(t=>`<li>${t}</li>`).join('') || '<li class="note">—</li>'}</ul></div>
          <div class="detailcol caution"><h4>주의 사항</h4><ul>${det.caution.map(t=>`<li>${t}</li>`).join('') || '<li class="note">—</li>'}</ul></div>

          <div class="output-box" style="grid-column:1/-1;"><b>🎯 목표 산출물:</b> ${output}</div>

          <div class="checklist-box" style="grid-column:1/-1;">
            <h4>셀프 체크 — 코드 / 문서 / 타이밍-검증 (오늘 일정대로 완료했는지 확인)</h4>
            ${det.checks.map(c=>`
              <div class="checkline ${STATE.dayChecks[c.id]?'done':''}" data-check-line="${c.id}">
                <input type="checkbox" data-daycheck="${c.id}" ${STATE.dayChecks[c.id]?'checked':''}>
                <span>${c.text}</span>
              </div>`).join('')}
          </div>

          <div class="actual-box">
            <h4>② 오늘 실제로 한 일 — 근거 없으면 달성률 0%로 간주</h4>
            <div class="actual-grid">
              <div>
                <label>실제 결과</label>
                <textarea data-actual-result="${idx}" placeholder="오늘 실제로 진행/완료한 내용">${actual.result}</textarea>
              </div>
              <div>
                <label>달성률</label>
                <input type="number" min="0" max="100" step="5" data-actual-pct="${idx}" value="${actual.pct}">
              </div>
              <div>
                <label>근거 (커밋·PR·테스트·캡처 링크)</label>
                <textarea data-actual-evidence="${idx}" placeholder="예: git commit abc1234 / PR #12 / 테스트 로그 링크">${actual.evidence}</textarea>
              </div>
            </div>
          </div>

          <div class="gap-box">
            <h4>③ 미달성 항목 — 부진 사유 &amp; 개선 방향 (달성률 100%가 아니면 작성)</h4>
            <div class="gap-grid">
              <div><label>왜 부진했나 (사실)</label><textarea data-gap-reason="${idx}" placeholder="사실 기반으로">${gap.reason}</textarea></div>
              <div><label>근본 원인</label><textarea data-gap-cause="${idx}">${gap.cause}</textarea></div>
              <div><label>개선 액션</label><textarea data-gap-action="${idx}">${gap.action}</textarea></div>
              <div><label>언제까지</label><input type="text" data-gap-due="${idx}" value="${gap.due}" placeholder="예: D+1"></div>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
    return mainRow + detailRow;
  }).join('');

  el.innerHTML = `
    <h2>5. Week/Day 기준 상세 실행계획 (Rev0~3, 영업일 기준)</h2>
    <p class="hint">주말(토/일)과 공휴일(추석 연휴 9/24~9/25, 개천절 대체휴일 10/5, 한글날 10/9)을 모두 제외했습니다. 9/14(월)부터 근무일 17일이 Rev0~3(+OTA) 범위이며, <b>10/12(월)</b>이 Rev4~7 재산정 지점입니다.</p>

    <h3 style="font-size:13px; margin:14px 0 8px 0;">⓪ 이번 주 마일스톤 (주 단위 고정 — 완료 기준(DoD) 기준으로 판단)</h3>
    <div class="card" style="padding:0; overflow-x:auto; margin-bottom:16px;">
      <table class="milestone">
        <tr><th style="width:8%">Week</th><th style="width:26%">주간 과제</th><th>완료 기준 (Definition of Done)</th><th class="center" style="width:9%">마감</th><th class="center" style="width:12%">진척</th></tr>
        ${milestoneRows}
      </table>
    </div>

    <p class="hint">행을 클릭하면 그날의 개발 팁·검증 사항·주의 사항·목표 산출물과 셀프 체크리스트가 펼쳐지고, 그 아래에서 오늘 실제로 한 일(실적+근거)과 미달성 사유를 직접 기록할 수 있습니다. 전부 자동 저장됩니다.</p>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <tr><th style="width:2%"></th><th class="center" style="width:6%">영업일</th><th class="center" style="width:7%">Week</th><th class="center" style="width:11%">Date</th><th style="width:18%">핵심 작업</th><th>세부 내용</th><th style="width:16%">비고</th></tr>
        ${rows}
      </table>
    </div>
  `;

  el.querySelectorAll('[data-day-toggle]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const idx = Number(tr.dataset.dayToggle);
      const detailEl = document.getElementById('detail-'+idx);
      const expander = tr.querySelector('.expander');
      const nowOpen = detailEl.classList.toggle('open');
      expander.textContent = nowOpen ? '▾' : '▸';
      if(nowOpen) openDays.add(idx); else openDays.delete(idx);
    });
  });
  el.querySelectorAll('[data-daycheck]').forEach(cb=>{
    cb.addEventListener('click', e=> e.stopPropagation()); // don't collapse the row when clicking the checkbox
    cb.addEventListener('change', e=>{
      const id = e.target.dataset.daycheck;
      STATE.dayChecks[id] = e.target.checked;
      saveState(); // triggers renderAll(); openDays is preserved so this row stays expanded
    });
  });
  // stop clicks inside the actual/gap form area from bubbling up and collapsing the row
  el.querySelectorAll('.actual-box, .gap-box').forEach(box=>{
    box.addEventListener('click', e=> e.stopPropagation());
  });
  el.querySelectorAll('[data-actual-result]').forEach(t=>{
    t.addEventListener('click', e=>e.stopPropagation());
    t.addEventListener('change', e=>{
      const idx = e.target.dataset.actualResult;
      STATE.dayActual[idx] = Object.assign({}, STATE.dayActual[idx], {result: e.target.value});
      saveState();
    });
  });
  el.querySelectorAll('[data-actual-pct]').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', e=>{
      const idx = e.target.dataset.actualPct;
      const v = Math.max(0, Math.min(100, Number(e.target.value)||0));
      STATE.dayActual[idx] = Object.assign({}, STATE.dayActual[idx], {pct: v});
      saveState();
    });
  });
  el.querySelectorAll('[data-actual-evidence]').forEach(t=>{
    t.addEventListener('click', e=>e.stopPropagation());
    t.addEventListener('change', e=>{
      const idx = e.target.dataset.actualEvidence;
      STATE.dayActual[idx] = Object.assign({}, STATE.dayActual[idx], {evidence: e.target.value});
      saveState();
    });
  });
  el.querySelectorAll('[data-gap-reason],[data-gap-cause],[data-gap-action],[data-gap-due]').forEach(t=>{
    t.addEventListener('click', e=>e.stopPropagation());
    t.addEventListener('change', e=>{
      const field = ['gapReason','gapCause','gapAction','gapDue'].find(f=>e.target.dataset[f]!==undefined);
      const key = {gapReason:'reason', gapCause:'cause', gapAction:'action', gapDue:'due'}[field];
      const idx = e.target.dataset[field];
      STATE.dayGap[idx] = Object.assign({}, STATE.dayGap[idx], {[key]: e.target.value});
      saveState();
    });
  });
}

function renderArchitecture(){
  const el = document.getElementById('tab-arch');
  el.innerHTML = `
    <h2>1. 아키텍처 결정 요약 (2026-09-14 문서 기반)</h2>
    <div class="scope-note">
      <b>프로젝트 성격 변경:</b> fNIRS는 신규 <b>양산형 디바이스</b>로 재정의되었습니다. 기존 테스트 디바이스는 센서 연구개발/알고리즘 검증용 프로토타입이었고, 이번엔 처음부터 양산 기준으로 재설계합니다.
      다만 사내 자산을 명시적으로 차용합니다 — <b>구조</b>는 <code>TedreamS1</code>(nRF5 SDK/FreeRTOS), <b>프로토콜 관례</b>는 <code>NCS_TedreamS2</code>(NCS/Zephyr 전환 선례), <b>베이스 플랫폼</b>은 신규 결정으로 <b>Nordic nRF Connect SDK + Zephyr OS</b>입니다.
      연구용 프로토타입 코드 자체는 확장하지 않되, 논문 재현 사양(파장/샘플링레이트/전력 등)은 검증 기준(AT)으로 계승합니다.
    </div>

    <div class="priority-banner">
      <b>§0 현 단계 최우선 목표:</b> 각 파장(640/680/950nm)별 LED 데이터를 분리해서, AS7341로부터 I2C를 통해 정확하게 읽어오는 것.
      Source multiplexing 타이밍·dark-frame subtraction·SQI·batching 등 세부 조정은 <b>이 정확한 raw 데이터 획득이 검증된 이후</b> 순차적으로 결정합니다.
      아래 §5~7 중 LED/AS7341 정책·BLE 파라미터·Ring buffer 구조·Runtime 목표는 2026-09-15 결정으로 확정되었고, Thermal 세부 수치와 배터리/DFU/생산검사/규제는 여전히 보류 상태입니다 — 자세한 현황은 "미확정 항목" 탭 참고.
    </div>

    <h2>2. OS/아키텍처 결정</h2>
    <h3>2.1 Bare-metal vs Zephyr — ✅ 확정: Zephyr(NCS) 채택</h3>
    <table>
      <tr><th style="width:16%">판단 근거</th><th>내용</th></tr>
      <tr><td><b>채택 이유</b></td><td>BLE 연결관리/재연결, ring buffer, watchdog, 센서 fault recovery, 배터리/온도 모니터링, DFU, 생산검사 모드 등 양산 요구사항이 많고 계속 늘어날 것 — bare-metal 상태머신으로는 유지보수 비용이 빠르게 커짐</td></tr>
      <tr><td><b>우려/보완</b></td><td>Zephyr 스케줄러/<code>k_timer</code>만으로는 100ms acquisition의 정밀도가 불충분할 수 있음 → HW RTC 기반 트리거를 Zephyr와 병행하는 하이브리드 구조로 보완 (§2.3 참고)</td></tr>
      <tr><td><b>사내 근거</b></td><td><code>NCS_TedreamS2</code>가 이미 동일한 결정(Zephyr)을 내리고 운영 중 — 신규 결정이 아니라 검증된 선례를 따르는 것</td></tr>
      <tr><td><b>확정 현황</b></td><td>2026-09-15 팀 승인 완료 — bare-metal 검토 종료</td></tr>
    </table>

    <h3>2.2 Acquisition/BLE Task 분리 원칙 (핵심 아키텍처)</h3>
    <div class="arch-pre">LFCLK → RTC(100ms event) → ISR(timestamp+semaphore만)
                               │
                               ▼
                     Acquisition Task (High)
                     LED 제어 / AS7341 Read / Timestamp / SeqNum
                               │
                          Ring Buffer
                               │
                               ▼
                     BLE TX Task (Medium)
                     Packet Batching / Notify / Retry</div>
    <ul style="font-size:12.8px; margin-top:10px;">
      <li>Acquisition과 BLE 통신은 반드시 <b>독립적으로 동작</b> — BLE 지연/재연결/혼잡이 optical sampling timing에 영향을 주면 안 됨</li>
      <li>ISR은 <b>timestamp capture + semaphore/event set만</b> 수행 (BLE notify, log, flash write, I2C 트랜잭션, 신호처리, malloc 금지)</li>
      <li>Task 우선순위: <b>Acquisition &gt; BLE TX &gt; Control/Command &gt; Battery/Temperature &gt; Logging/Diagnostics</b></li>
      <li>저전력 원칙: 모든 task는 <b>event-driven</b>(semaphore/message queue 대기), busy polling 금지</li>
    </ul>

    <h3>2.3 RTC vs TIMER — ✅ 하이브리드 구조 확정 (100ms 정확도 확보 방법)</h3>
    <ul style="font-size:12.8px;">
      <li>10Hz(100ms) periodic wake-up은 <b>RTC/LFCLK 기반</b>으로 확정 (저전력 유리, HF TIMER 상시구동 불필요)</li>
      <li><b>Zephyr <code>k_timer</code>를 거치지 않고 nrfx RTC 드라이버를 직접 사용</b> — Zephyr 커널 틱 스케줄링을 경유하면 ISR 지연이 수백 us~1ms 단위로 흔들릴 수 있어, nrfx RTC의 CC(Compare) 인터럽트를 직접 핸들링해 지연을 최소화</li>
      <li><b>Drift 보정(Bresenham형 오차분산):</b> LFCLK 32.768kHz 기준 100ms는 3276.8 tick으로 정수가 아니므로, 매 프레임 0.8 tick의 소수부 오차가 누적됩니다. CC 값을 매번 3277로 고정하면 장기적으로 느려지고, 3276으로 고정하면 빨라집니다 → <b>5프레임마다 1회 3277, 나머지는 3276으로 교대 설정</b>(5프레임 합계 = 3276×4+3277 = 13381 tick = 정확히 500ms)해 누적 오차를 주기적으로 상쇄</li>
      <li>LED sequencing/광 획득 내부의 us~ms 정밀 타이밍이 필요한 구간에서만 <b>HF TIMER 또는 DPPI/PPI</b>를 국소적으로 사용 (RTC wake 이후 필요할 때만 HFCLK enable)</li>
      <li>예상 시퀀스: <code>RTC CC 인터럽트(보정된 tick) → (필요시) HFCLK enable → LED PWM sequence → AS7341 acquisition → peripheral idle → sleep</code></li>
      <li>구현 후 반드시 오실로스코프/로직분석기로 장시간(수십분~1시간) 실측해 누적 drift가 보정 없이 방치된 경우 대비 얼마나 줄었는지 검증 (Day4, R0-4 self-check 항목)</li>
    </ul>

    <h3>2.4 BLE 파라미터 구조 — ✅ S2 계승 (Day9, R2-1에서 실측 확정 예정)</h3>
    <ul style="font-size:12.8px;">
      <li>Tx power <b>-8dBm 고정</b>, 전 패킷 <b>32bit us 타임스탬프</b> — S2 정책 그대로 계승</li>
      <li>Connection interval은 S2 선례 범위(7.5~30ms) 내에서 실시간성/배터리 트레이드오프를 실측 후 확정</li>
      <li>MTU는 BLE 5.0 Extended Length 기준 최대 251byte를 목표로 협상, 실패 시 기본 23byte로 폴백하는 경로도 구현</li>
      <li>Batch size는 패킷헤더+3파장raw+seq+timestamp(샘플당 약 16~20byte) 기준, 협상된 MTU 페이로드 안에 들어가는 최대 샘플 수를 역산해 결정 (예: payload 244byte 기준 약 12~15샘플/패킷)</li>
    </ul>

    <h3>2.5 Ring Buffer / Flash Logging 구조 — ✅ S2 계승 (Day9, R2-1에서 구현)</h3>
    <ul style="font-size:12.8px;">
      <li>Ring buffer 크기: 10Hz 기준 BLE 지연 5~10초를 버틸 수 있는 50~100샘플에 안전마진을 더해 <b>100~200샘플</b>로 설계</li>
      <li>Flash logging은 초기 버전(Rev0~3)에서는 별도 구현하지 않음 — overflow 발생 시 §4 원칙대로 counter/flag만 기록. S2에 이미 구현된 로깅 방식이 있다면 Day9 착수 시 소스 재확인 후 재사용 여부 결정</li>
    </ul>

    <h2>3. S1 구조 × S2 프로토콜 × 신규 아키텍처 통합 매핑</h2>
    <table>
      <tr><th style="width:12%">영역</th><th style="width:24%">S1 (구조 원본)</th><th style="width:24%">S2 (프로토콜 원본)</th><th>fNIRS 신규 결정</th></tr>

    <p class="arch-note">⚠️ S2 REVISION_HISTORY 분석 중 커밋 메시지와 실제 diff가 불일치하는 사례가 다수 발견됨(v0.1.4, v0.1.8 등). S2 프로토콜을 차용할 때는 반드시 코드 자체로 재검증하고 커밋 메시지만으로 판단하지 않는다.</p>

    <h2>4. 데이터 무결성 / 패킷 설계 원칙</h2>
    <p style="font-size:12.8px;"><b>RAW 데이터 보존 원칙:</b> MCU에서 Δ[H2O]로 가공하지 않고 3파장(640/680/950nm) raw optical intensity를 그대로 보존합니다. 추후 소광계수/DPF/필터링/캘리브레이션이 바뀌어도 원자료로 재분석 가능해야 하기 때문입니다. 역할 분리: <b>Device = acquisition 중심, PC/Server = 생리신호 처리 중심.</b></p>
    <table>
      <tr><th style="width:35%">필드</th><th>비고</th></tr>
      ${ARCH_FIELDS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
    </table>
    <p class="arch-note">Gain/Integration Time은 초기 검증 단계에서는 <b>고정</b>합니다(런타임 변경 시 생리신호처럼 보이는 인위적 step 발생 가능). 자동조절이 필요해지면 변경 시점·값을 반드시 데이터에 기록합니다.</p>
    <p class="arch-note"><b>Diagnostic telemetry 후보:</b> dropped_sample_count, max_ring_buffer_usage, ble_retry_count, disconnect_count, sensor_read_error_count, watchdog/reset_reason, battery_low_event, temperature_warning_event. Silent data loss 방지가 최우선 — overflow 발생 시 반드시 counter/flag로 기록.</p>

    <h2>5~7. 전력/BLE 최적화·Thermal·배터리</h2>
    <table>
      <tr><th style="width:16%">영역</th><th>내용</th></tr>
      <tr><td><b>LED/AS7341 (§5)</b></td><td>✅ 확정 — LED는 <b>PWM duty 제어</b> 방식(연속점등 아님). AS7341 gain/integration time은 §4 원칙대로 초기 검증 단계에서 고정값 사용(논문은 구체적 게인 수치를 공개하지 않아 Day6 R1-1에서 채널별 saturation 임계 게인을 자체 실측해 확정).</td></tr>
      <tr><td><b>전력/BLE 우선순위 (§5)</b></td><td>① LED PWM duty cycle → ② BLE packet batching → ③ CPU sleep/Zephyr PM → ④ Peripheral runtime PM. Ring Buffer로 BLE가 5~10초 막혀도 데이터 유실 없이 버퍼 유지(§2.5 확정).</td></tr>
      <tr><td><b>Thermal (§6)</b></td><td>[보류] 논문 기준 41°C 미만(최대 관측 약 40.1°C) 유지, Normal → Warning → LED current/duty 감소 → LED OFF 단계는 원칙으로 유지하되, 온도센서 위치·trip threshold·hysteresis 등 구체 수치는 "미확정 항목" 탭에서 보류 처리.</td></tr>
      <tr><td><b>배터리 Runtime (§7)</b></td><td>✅ 확정 — 제품 목표 <b>8h</b>. 논문 근거: 110mAh×3.7V=407mWh, 논문 평균소비전력 70~75mW → 실측 재현 약 5.4~5.8h(논문 보고 5.5h와 일치). 8h 달성에 필요한 평균소비전력은 407mWh/8h≈51mW로 논문 대비 약 30% 절감 필요 — LED PWM duty 제어만으로 달성 가능한 범위로 판단(Rev6 실측 튜닝). 10h(≈41mW, 약 44% 절감)는 배터리 용량 변경 없이는 공격적이라 1차 목표에서 제외, Rev6 실측 후 스트레치 목표로 재검토.</td></tr>
    </table>

    <p class="arch-note">배터리 용량/DFU 사양/calibration 저장구조·생산검사·규제 요구사항·논문 모순 2건은 여전히 <b>보류</b> 상태입니다 — 전체 현황은 <b>"미확정 항목"</b> 탭에서 체크로 추적합니다.</p>
