<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>fNIRS FW v1.2 개발 트래커</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --border:#E3E6EA;
  --text:#1B2430; --dim:#6B7480;
  --accent:#2C6E63; --due:#A23E58;
  --g0:#6B5B95; --g1:#C97B3D; --g2:#4C8C6B; --g3:#3C7A9E; --g4:#AD8B12; --g5:#A23E58;
  --st-todo:#E2555A; --st-todo-bg:#FDEBEC;
  --st-mid:#D9A441; --st-mid-bg:#FBF1DD;
  --st-done:#3F9142; --st-done-bg:#E7F4E8;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--border); padding:14px 22px 0 22px;
}
.headtop{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;}
h1{font-size:18px; margin:0 0 2px 0;}
.subtitle{color:var(--dim); font-size:12.5px; margin:0 0 10px 0;}
.stats{display:flex; gap:10px; flex-wrap:wrap;}
.stat{
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:8px 14px; min-width:104px; text-align:center;
}
.stat .num{font-size:19px; font-weight:700;}
.stat .lbl{font-size:11px; color:var(--dim); margin-top:1px;}
nav{display:flex; gap:2px; margin-top:12px; overflow-x:auto;}
nav button{
  background:none; border:none; padding:10px 14px; font-size:13px; color:var(--dim);
  cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;
}
nav button.active{color:var(--text); border-bottom-color:var(--accent); font-weight:600;}
nav button:hover{color:var(--text);}
main{padding:20px 22px 60px 22px; max-width:1500px; margin:0 auto;}
section{display:none;}
section.active{display:block;}
h2{font-size:15px; margin:22px 0 8px 0; padding-bottom:6px; border-bottom:1px solid var(--border);}
h2:first-child{margin-top:0;}
p.hint{color:var(--dim); font-size:12.5px; margin:4px 0 12px 0;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:16px;}

table{border-collapse:collapse; width:100%; font-size:12.8px;}
th{background:var(--text); color:#fff; text-align:left; padding:7px 9px; font-weight:600;}
td{border-bottom:1px solid var(--border); padding:7px 9px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.note{color:var(--dim); font-size:11.3px; display:block; margin-top:2px;}
.center{text-align:center;}

.chip{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff;}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.pill.todo{background:var(--st-todo-bg); color:var(--st-todo);}
.pill.mid{background:var(--st-mid-bg); color:var(--st-mid);}
.pill.done{background:var(--st-done-bg); color:var(--st-done);}
.pill.excl{background:#EEE; color:#999;}
.prio{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:5px; border:1px solid currentColor;}
.prio.P0{color:#B33; }
.prio.P1{color:#B37E00;}
.prio.P2{color:#999;}

.pctrow{display:flex; align-items:center; gap:6px;}
input[type=number].pctinput{width:52px; padding:3px 4px; border:1px solid var(--border); border-radius:5px; font-size:12.5px; text-align:right;}
.qbtn{border:1px solid var(--border); background:#fff; border-radius:5px; padding:2px 6px; font-size:10.5px; cursor:pointer; color:var(--dim);}
.qbtn:hover{background:var(--bg);}
input[type=checkbox]{width:16px; height:16px; cursor:pointer;}

.grouphead td{background:#FAFAFB; font-weight:700; font-size:12px; padding-top:10px;}
.groupbar-wrap{display:inline-block; width:110px; height:6px; background:#EEE; border-radius:3px; overflow:hidden; vertical-align:middle; margin-left:8px;}
.groupbar-fill{height:100%;}

/* Gantt */
.ganttscroll{overflow-x:auto;}
table.gantt{table-layout:fixed; font-size:10.5px;}
table.gantt th, table.gantt td{border:none; padding:0; text-align:center;}
table.gantt th.rowlabel, table.gantt td.rowlabel{
  text-align:left; width:230px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:3px 6px; border-right:1.5px solid #ccc; font-size:11px;
}
table.gantt col.daycol{width:34px;}
table.gantt th.gh{padding:3px 0; color:var(--dim); font-weight:500; border-bottom:1px solid var(--border);}
table.gantt th.gh.mark-target{color:var(--due); font-weight:700; background:#F7EAEE;}
table.gantt td.daycell{height:28px; border-bottom:1px solid #F0F0F2;}
.barwrap{position:relative; height:20px; margin:4px 3px; border-radius:4px; background:#F0F0F2;}
.barfill{position:absolute; left:0; top:0; height:100%; border-radius:4px 0 0 4px;}
.barfill.full{border-radius:4px;}
.barpct{position:absolute; right:5px; top:50%; transform:translateY(-50%); font-size:9px; color:#fff; font-weight:700; text-shadow:0 1px 1px rgba(0,0,0,.25);}
.barpct.dark{color:#444; text-shadow:none;}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; font-size:12px;}
.legend span.sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle;}

.riskitem{display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-bottom:1px solid var(--border);}
.riskitem:last-child{border-bottom:none;}
.riskitem.resolved{opacity:.5;}
.riskitem.resolved .risktext{text-decoration:line-through;}

.at-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
.at-row:last-child{border-bottom:none;}
.at-id{font-weight:700; width:52px; flex:0 0 auto;}
.at-name{font-weight:600; width:150px; flex:0 0 auto;}
.at-cond{color:var(--dim); flex:1;}

.metabox td{border:1px solid var(--border); padding:6px 12px;}
.metabox td.k{background:#FAFAFB; font-weight:700; width:120px;}

.overview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:900px){.overview-grid{grid-template-columns:1fr;}}
.contra{border-left:4px solid #C62828; background:#FFF6F6; padding:8px 12px; border-radius:0 6px 6px 0; margin-bottom:8px; font-size:12.5px;}
.contra b{color:#C62828;}
.resetbar{margin-top:26px; text-align:right;}
.resetbtn{background:none; border:1px solid var(--border); color:var(--dim); border-radius:6px; padding:6px 12px; font-size:11.5px; cursor:pointer;}
.resetbtn:hover{border-color:#c66; color:#c66;}

/* Day plan expandable rows */
tr.dayrow{cursor:pointer;}
tr.dayrow:hover td{background:#FAFAFC;}
tr.dayrow td.expander{width:20px; text-align:center; color:var(--dim); font-size:10px;}
.daypct-pill{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:10.5px; font-weight:700;}
.daypct-pill.zero{background:#F0F0F2; color:#999;}
.daypct-pill.some{background:var(--st-mid-bg); color:var(--st-mid);}
.daypct-pill.full{background:var(--st-done-bg); color:var(--st-done);}
tr.detailrow{display:none;}
tr.detailrow.open{display:table-row;}
tr.detailrow td{background:#FAFAFB; padding:14px 20px 16px 20px; border-bottom:1px solid var(--border);}
.detailgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
@media (max-width:1100px){.detailgrid{grid-template-columns:1fr;}}
.detailcol h4{font-size:11.5px; margin:0 0 6px 0; color:var(--dim); text-transform:none; letter-spacing:.2px;}
.detailcol ul{margin:0; padding-left:16px; font-size:12px;}
.detailcol li{margin-bottom:5px;}
.detailcol.tips h4{color:#3C7A9E;}
.detailcol.verify h4{color:#4C8C6B;}
.detailcol.caution h4{color:#B33;}
.checklist-box{grid-column:1/-1; margin-top:6px; padding-top:10px; border-top:1px dashed var(--border);}
.checklist-box h4{font-size:11.5px; margin:0 0 6px 0; color:var(--dim);}
.checkline{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.3px;}
.checkline.done span{text-decoration:line-through; color:#999;}
footer{text-align:center; color:var(--dim); font-size:11px; padding:14px; }
</style>
</head>
<body>

<header>
  <div class="headtop">
    <div>
      <h1>fNIRS Wearable FW v1.0 개발 트래커</h1>
      <div class="subtitle">Ban et al., Sci. Adv. 12, eaad2056 (2026) 기반 · 담당 Wade · 목표 완료일 2026-10-15(목) (추석·개천절 대체휴일·한글날 반영 재조정)</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statOverall">–%</div><div class="lbl">FW 개발 진행률</div></div>
      <div class="stat"><div class="num" id="statAT">–</div><div class="lbl">AT 통과 (v1.0)</div></div>
      <div class="stat"><div class="num" id="statDday">–</div><div class="lbl">목표일까지 영업일</div></div>
      <div class="stat"><div class="num" id="statUpdated">–</div><div class="lbl">마지막 업데이트</div></div>
    </div>
  </div>
  <nav id="tabnav"></nav>
</header>

<main>
  <section id="tab-overview"></section>
  <section id="tab-analysis"></section>
  <section id="tab-tasks"></section>
  <section id="tab-gantt"></section>
  <section id="tab-dayplan"></section>
  <section id="tab-at"></section>
  <section id="tab-risk"></section>
  <section id="tab-review"></section>
</main>

<footer>진행 상황을 입력하면 로컬에 자동 저장되며, 체크리스트·그룹 진행률·간트차트가 같은 데이터를 기준으로 함께 갱신됩니다.</footer>

/* ============================== BUSINESS-DAY CALENDAR ============================== */
// Korean public holidays that fall inside the project window and must be excluded
// from the working-day count (confirmed with the team on 2026-09-15):
//  - 9/24, 9/25: 추석 연휴 (Chuseok) — 9/26 is already a Saturday, so no extra exclusion needed there
//  - 10/5: 개천절 대체공휴일 (Gaecheonjeol substitute holiday, since 10/3 fell on a Saturday)
//  - 10/9: 한글날 (Hangul Day, fixed annual public holiday) — confirmed with the team on 2026-09-15
//    to also be treated as a day off, even though it coincided with this project's own target date.
const HOLIDAYS = new Set(['2026-09-24', '2026-09-25', '2026-10-05', '2026-10-09']);
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isBizDay(d){ const w=d.getDay(); return w!==0 && w!==6 && !HOLIDAYS.has(dateKey(d)); }
function genBizDays(start,end){
  const out=[]; let d=new Date(start);
  while(d<=end){ if(isBizDay(d)) out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
const CAL_START = new Date(2026,8,11);
const CAL_SEARCH_END = new Date(2026,10,20); // generous upper bound; we only keep the first 21 valid business days
const BIZDAYS = genBizDays(CAL_START, CAL_SEARCH_END).slice(0,21); // 21 *working* business days (weekends + holidays excluded)
const N_DAYS = BIZDAYS.length;
const TARGET_DATE = BIZDAYS[N_DAYS-1]; // last working day in the sequence = new target/Due date
const DUE_DATE = TARGET_DATE;
const TARGET_IDX = N_DAYS;
const DUE_IDX = N_DAYS;
const WD_KR=['일','월','화','수','목','금','토'];
function dLabel(i){const d=BIZDAYS[i-1]; return (d.getMonth()+1)+'/'+d.getDate();}
function wLabel(i){const d=BIZDAYS[i-1]; return WD_KR[d.getDay()];}

function businessDaysUntil(target){
  const today=new Date(); today.setHours(0,0,0,0);
  const t=new Date(target); t.setHours(0,0,0,0);
  if (today.getTime()===t.getTime()) return 0;
  const dir = today<t ? 1 : -1;
  let cur=new Date(today), count=0;
  while(cur.getTime()!==t.getTime()){
    cur.setDate(cur.getDate()+dir);
    if(isBizDay(cur)) count+=dir;
  }
  return count;
}

   own localStorage with the same async get/set shape. Either way the rest
   of the app just calls window.storage.get/set and doesn't need to know
   which backend is actually being used. */
if (typeof window.storage === 'undefined') {
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem('claude_artifact:' + key);
      return v !== null ? {key, value: v, shared:false} : null;
    },
    set: async (key, value) => {
      localStorage.setItem('claude_artifact:' + key, value);
      return {key, value, shared:false};
    },
    delete: async (key) => {
      localStorage.removeItem('claude_artifact:' + key);
      return {key, deleted:true, shared:false};
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith('claude_artifact:' + (prefix||'')))
        .map(k => k.replace('claude_artifact:', ''));
      return {keys, shared:false};
    },
  };
}

async function loadState(){
  try{
    const res = await window.storage.get('fw_tracker_state', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      STATE.taskProgress = Object.assign({}, DEFAULT_STATE.taskProgress, saved.taskProgress||{});
      STATE.atChecked    = Object.assign({}, DEFAULT_STATE.atChecked, saved.atChecked||{});
      STATE.riskResolved = Object.assign({}, DEFAULT_STATE.riskResolved, saved.riskResolved||{});
      STATE.reviewDecided = Object.assign({}, DEFAULT_STATE.reviewDecided, saved.reviewDecided||{});
      STATE.dayChecks = Object.assign({}, DEFAULT_STATE.dayChecks, saved.dayChecks||{});
      STATE.updatedAt = saved.updatedAt || null;
    }
  }catch(e){ /* no saved state yet — use defaults */ }
  renderAll();
}
async function saveState(){
  STATE.updatedAt = new Date().toISOString();
  try{
    await window.storage.set('fw_tracker_state', JSON.stringify(STATE), false);
  }catch(e){ console.error('storage save failed', e); }
  renderAll();
}

/* ============================== HELPERS ============================== */
function statusOf(pct){ if(pct>=100) return 'done'; if(pct>0) return 'mid'; return 'todo'; }
function statusLabel(pct){ if(pct>=100) return '완료'; if(pct>0) return '진행중'; return '미착수'; }
function groupAvg(gid){
  const ts = TASKS.filter(t=>t.group===gid && !t.excl);
  if(!ts.length) return 0;
  return Math.round(ts.reduce((s,t)=>s+STATE.taskProgress[t.id],0)/ts.length);
}
function overallAvg(){
  const ts = TASKS.filter(t=>!t.excl);
  return Math.round(ts.reduce((s,t)=>s+STATE.taskProgress[t.id],0)/ts.length);
}

  const det = DAY_DETAILS[dayIdx];

  return {done, total: det.checks.length};
}

    <div class="card">
      ${REVIEW_DOWNGRADE.map(r=>`
        <div class="riskitem" data-review-row="${r.id}">
          <input type="checkbox" data-review="${r.id}" ${STATE.reviewDecided[r.id]?'checked':''}>
          <div>
            <b>${r.title}</b>
            <div style="margin-top:3px; font-size:12.3px; color:var(--dim);">${r.body}</div>
          </div>
        </div>`).join('')}
    </div>

    <h3 style="font-size:13px; margin:16px 0 6px 0;">B. 추가 권장 — 실제 개발 목표를 위해 필요하나 현재 목록에 없음</h3>
    <div class="card">
      ${REVIEW_ADD.map(r=>`
        <div class="riskitem" data-review-row="${r.id}">
          <input type="checkbox" data-review="${r.id}" ${STATE.reviewDecided[r.id]?'checked':''}>
          <div>
            <b>${r.title}</b>
            <div style="margin-top:3px; font-size:12.3px; color:var(--dim);">${r.body}</div>
          </div>
        </div>`).join('')}
    </div>

    <h3 style="font-size:13px; margin:16px 0 6px 0;">검토 결과 요약</h3>
    <p class="hint" style="margin:0;">
    나머지 19개 원 목록 항목(0-1~0-3, 1-1~1-4, 2-1~2-4, 3-1~3-3·3-5, 4-1·4-3·4-4, 5-1·5-2)은
    논문의 3파장 LED·AS7341·BLE·41℃ 열안전·SNR 스펙과 직접 대응되어 <b>불필요한 항목으로 보이지 않습니다.</b>
    </p>
  `;
  el.querySelectorAll('[data-review]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const id = e.target.dataset.review;
      STATE.reviewDecided[id] = e.target.checked;
      document.querySelector(`[data-review-row="${id}"]`).classList.toggle('resolved', e.target.checked);
      saveState();
    });
  });
}

function renderAll(){
  renderHeaderStats();
  renderOverview();
  renderAnalysis();
  renderTasks();
  renderGantt();
  renderDayplan();
  renderAT();
  renderRisk();
  renderReview();
}

buildNav();
loadState();
</script>
</body>
</html>
